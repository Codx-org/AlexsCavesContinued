# Gradle
# 4G runs out of heap once two nodes compile in one invocation and the compiler is holding
# thousands of diagnostics (a mid-port node can emit ~4k errors).
org.gradle.jvmargs=-Xmx8G
org.gradle.daemon=false
# arch-loom provisions MC on the daemon JVM. Per-node compile JVMs (17/21/25) come from
# Gradle toolchains, so a newer JDK here is fine.
org.gradle.java.home=/usr/lib/jvm/java-21-openjdk

# Mod identity lives in stonecutter.properties.toml (mod.*); these are only fallbacks
# for tooling that reads gradle.properties directly.
mod_id=alexscaves
mod_name=Alex's Caves Continued
mod_group=com.github.alexmodguy
