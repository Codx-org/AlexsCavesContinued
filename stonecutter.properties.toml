# ---------------------------------------------------------------------------
# MC 26.x — the unobfuscated line. Forge nodes here build on Architectury Loom's
# NO-REMAP variant (build.forgenr.gradle.kts) because there is no SRG namespace to
# remap to, and they read accesstransformer_mojmap.cfg like the NeoForge nodes do.
# Java 25 (Context.javaVersion switches at >=26).
# ---------------------------------------------------------------------------

# 26.1, 26.1.1 and 26.1.2 are API-identical. codxlib nonetheless ships a NODE PER POINT
# RELEASE (that is part of why its matrix is 58 and not 52), and this tree matches it — so
# each one declares an EXACT range. Do not re-add `deps.minecraft-range = "[26.1, 26.1.3)"`
# here: with three real nodes a widened range makes all three jars claim 26.1, and the store
# hands players an arbitrary one.
[forge."26.1"]
deps.minecraft = "26.1"
deps.forge = "62.0.9"

[forge."26.1.1"]
deps.minecraft = "26.1.1"
deps.forge = "63.0.2"

[forge."26.1.2"]
deps.minecraft = "26.1.2"
deps.forge = "64.0.12"

[neoforge."26.1"]
