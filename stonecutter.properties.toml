# Alex's Caves Continued — Stonecutter central config. Single source of truth for node deps.
#
# This tree carries the ORIGINAL Alex's Caves Forge source (upstream 2.0.2, MC 1.20.1) forward
# across MC versions on Forge, NeoForge and Fabric — the same architecture as the sibling
# AlexsMobsContinued repo, whose pins this table is copied from (they are empirically the
# newest builds that actually resolve and boot on Gradle 9).
#
# Only versions listed as nodes in settings.gradle.kts are built; the extra sections below
# are the forward map, pre-filled.

loomx.loom_version = "1.16-SNAPSHOT"

mod.id = "alexscaves"
mod.name = "Alex's Caves Continued"
mod.group = "com.github.alexmodguy"
mod.version = "1.0.0"
mod.description = "Explore new rare cave biomes hidden under the surface of the Overworld."
mod.authors = ["Alexthe668", "Noonyeyz", "Codx.io"]
mod.license.name = "LGPL-3.0"
mod.license.url = "https://www.gnu.org/licenses/lgpl-3.0.html"
mod.sources_url = "https://github.com/AlexModGuy/AlexsCaves"
mod.homepage_url = "https://www.curseforge.com/minecraft/mc-mods/alexs-caves"
mod.issues_url = "https://github.com/AlexModGuy/AlexsCaves/issues"
mod.inception_year = "2023"

# Fabric-only manifest fields (ignored by the Forge/NeoForge manifest generators).
# The access widener is Fabric's answer to the Forge access transformer; it is generated
# from META-INF/accesstransformer_mojmap.cfg and lives at the resource root.
mod.fabric.entrypoint_main = "com.github.alexmodguy.alexscaves.fabric.AlexsCavesFabric"
mod.fabric.entrypoint_client = "com.github.alexmodguy.alexscaves.fabric.AlexsCavesFabricClient"
mod.fabric.access_widener = "alexscaves.accesswidener"
# Upstream's logo lives where the Forge manifest's logoFile points, not at Fabric's
# conventional assets/<modid>/icon.png. Pointing at it beats duplicating the PNG per jar.
mod.fabric.icon = "assets/alexscaves/textures/misc/mod_logo.png"

# CodxLib — the shared companion library every codx mod depends on. Each node consumes the
# matching per-node artifact codx:codxlib:<codxlib>-<loader>+<mc> from mavenLocal; the full
# coordinate is assembled in build.<loader>.gradle.kts. This is the BUILD-TIME pin (compile
# classpath + dev runs); the RUNTIME floor players must satisfy is declared separately as a
# version range in each buildscript's platform { dependencies { required("codxlib") } }.
deps.codxlib = "1.3.6"

# ---------------------------------------------------------------------------
# Forge (net.minecraftforge:forge, built via Architectury Loom on Gradle 9).
# deps.forge is the build number only; "<mc>-<forge>" is assembled in the buildscript.
# Forge has NO upstream build for 1.20.5 or 1.21.2.
#
# There is deliberately NO deps.citadel on any node. Citadel only ever shipped for 1.20.1
# (Forge + NeoForge) and 1.21.1 (NeoForge), and Alex's Caves uses a far wider slice of it than
# Alex's Mobs did (shaders/PostEffectRegistry, SurfaceRulesManager, ExpandedBiomes,
# LightningRender, raycoms pathfinding, tick-rate modifiers). The whole subset is vendored and
# package-relocated into com.github.alexmodguy.alexscaves.citadel — see docs/notes/citadel.md.
# ---------------------------------------------------------------------------

