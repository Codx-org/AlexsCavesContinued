# This constructor was long listed below as deliberately omitted, on the grounds that nothing here
# calls it. That was wrong — ConversionCrucibleBlockEntity builds a Context by hand to ask the
# overworld surface rules what block belongs on top — and it went unnoticed because NeoForge widens
# the very same constructor in its own patches, so every NeoForge node compiled without this line.
# 26.1-forge is the first Mojmap node that is NOT NeoForge (loom + this file, no Neo patches), and
# it is where the gap surfaced. The parameter list is byte-identical on every Mojmap node from
# 1.20.6 to 26.1 (javap-checked on both ends), so one entry covers the whole range.
