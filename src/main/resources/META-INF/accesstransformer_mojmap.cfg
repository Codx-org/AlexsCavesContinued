# --- deliberately NOT carried over from accesstransformer.cfg ---
# Entity#getAllowedMovement            -> the Mojmap name is `collide`, granted above.
# RenderBuffers#fixedBuffers           -> `fixedBufferPack` since 1.20.2, and nothing reads it.
# SimpleCookingSerializer$CookieBaker  -> gone in 1.20.2+ (AbstractCookingRecipe$Factory).
# BackupConfirmScreen#listener         -> `onProceed` since 1.20.2, and nothing reads it.
# PlayerInfo#textureLocations          -> gone in 1.20.2+ (PlayerSkin), and nothing reads it.
# Item#renderProperties                -> a Forge-1.20.1-only field; nothing vendored reads it.
# Timer#msPerTick                      -> the class itself is gone in 1.21 (DeltaTracker$Timer),
#                                         and the field is final there. mixin.client.citadel.
#                                         TimerAccessor does the widening on the versions that
#                                         still have it; the SRG file dropped it for the same
#                                         reason, so the two stay in step.
