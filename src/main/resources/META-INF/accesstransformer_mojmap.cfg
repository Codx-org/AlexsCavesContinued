# Mojang-named access transformer — the twin of accesstransformer.cfg.
#
# Classic Forge (<1.20.6) runs on SRG, so its AT names members f_12345_/m_12345_; NeoForge and the
# unobfuscated 26.x Forge line run on Mojmap and need the same widenings spelled with the real
# names. Both buildscripts ship whichever one they use as META-INF/accesstransformer.cfg in the jar
# (processResources renames it), so only one ever reaches a loader.
#
# Keep the two files in sync WHEN A WIDENING IS ADDED, but not line-for-line: some of the SRG
# file's entries have no counterpart here because the member was renamed, retyped or deleted after
# 1.20.1, and an AT entry that resolves to nothing is a hard error on NeoForge. Those cases are
# listed at the bottom.

